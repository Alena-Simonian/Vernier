# Pinned so a worktree checkout joins the same stack as the main one instead of
# starting a second, folder-named one that fights it for the ports.
name: vernier

services:
  postgres:
    image: postgis/postgis:15-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: vernier_dev
      POSTGRES_USER: vernier
      POSTGRES_PASSWORD: vernier
    ports:
      - "${VERNIER_POSTGRES_PORT:-55432}:5432"
    volumes:
      - vernier-postgres-data:/var/lib/postgresql/data
      - ./dev/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vernier -d vernier_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: vernier_dev
      MYSQL_USER: vernier
      MYSQL_PASSWORD: vernier
      MYSQL_ROOT_PASSWORD: vernier
    ports:
      - "${VERNIER_MYSQL_PORT:-53306}:3306"
    volumes:
      - vernier-mysql-data:/var/lib/mysql
      - ./dev/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pvernier"]
      interval: 2s
      timeout: 3s
      retries: 30

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: vernier_dev
      MARIADB_USER: vernier
      MARIADB_PASSWORD: vernier
      MARIADB_ROOT_PASSWORD: vernier
    ports:
      - "${VERNIER_MARIADB_PORT:-53307}:3306"
    volumes:
      - vernier-mariadb-data:/var/lib/mysql
      - ./dev/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 30

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Vernier_MssqlSA1!
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    ports:
      - "${VERNIER_MSSQL_PORT:-51433}:1433"
    volumes:
      - vernier-mssql-data:/var/opt/mssql
      - ./dev/mssql/init:/vernier-init:ro
      - ./dev/mssql/entrypoint.sh:/entrypoint.sh:ro
    healthcheck:
      # Proves the seed applied (a row count as the app login), not just that
      # the server answers: the same MySQL "healthy but half-seeded" trap. The
      # marker is what says the seed finished, since `accounts` fills early.
      test: ["CMD-SHELL", "test -f /var/opt/mssql/data/.vernier-seeded && /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U vernier -P Vernier_dev1 -d vernier_dev -b -Q 'SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.accounts;'"]
      interval: 5s
      timeout: 5s
      retries: 60

  mongo:
    # Not 8.0 or latest: on a Linux kernel 6.19+ (current Docker Desktop VMs)
    # they refuse to start (SERVER-121912). 8.2 is the line that boots there.
    image: mongo:8.2
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: vernier
      MONGO_INITDB_DATABASE: vernier_dev
    ports:
      - "${VERNIER_MONGO_PORT:-57017}:27017"
    volumes:
      - vernier-mongo-data:/data/db
      - ./dev/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The seed runs against a temporary mongod bound to 127.0.0.1 only, so
      # asking on the container's own address is what proves the real server
      # is up; the count is what proves the seed finished (it fills last).
      test: ["CMD-SHELL", "mongosh --quiet --host \"$$(hostname -i)\" -u vernier -p vernier vernier_dev --eval 'quit(db.wide_metrics.countDocuments() === 25 ? 0 : 1)'"]
      interval: 2s
      timeout: 5s
      retries: 90

  redis:
    # 8 rather than 7: JSON and Search ship in the image itself.
    image: redis:8
    entrypoint: ["/bin/sh", "/vernier-init/entrypoint.sh"]
    ports:
      - "${VERNIER_REDIS_PORT:-56379}:6379"
    volumes:
      - ./dev/redis:/vernier-init:ro
    healthcheck:
      # The marker is what says the seed finished; a ping alone answers as
      # soon as the server is up, before a key is written.
      test: ["CMD-SHELL", "test -f /tmp/vernier-seeded && redis-cli --user vernier --pass vernier --no-auth-warning ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  clickhouse:
    # The seed is baked into the image rather than mounted: a bind mount would
    # record this checkout's path in the stack that every worktree shares.
    build: ./dev/clickhouse
    environment:
      CLICKHOUSE_DB: vernier_dev
      CLICKHOUSE_USER: vernier
      CLICKHOUSE_PASSWORD: vernier
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${VERNIER_CLICKHOUSE_PORT:-58123}:8123"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - vernier-clickhouse-data:/var/lib/clickhouse
    healthcheck:
      # Asked on the container's own address: the seed runs against a
      # temporary server bound to localhost only. type_gallery is seeded last,
      # so its rows prove the whole seed applied.
      test: ["CMD-SHELL", "clickhouse-client --host \"$$(hostname -i)\" -u vernier --password vernier -q 'SELECT count() FROM vernier_dev.type_gallery' | grep -qx 2"]
      interval: 2s
      timeout: 5s
      retries: 90

  # Dev SSH bastions for the tunnel feature: `bastion` is reachable from the
  # host, `bastion2` only through it (no published port), so a tunnel through
  # either can be exercised against `postgres`/`mysql`/`mssql` by name. Regular
  # services rather than a profile so local dev and CI stay identical.
  # `dev/ssh/setup.sh` writes the key and ssh_config they read; `docker compose
  # up` alone starts them fine with no key mounted, just nobody can log in yet.
  bastion:
    build: ./dev/ssh
    ports:
      - "${VERNIER_SSH_PORT:-52222}:22"
    volumes:
      - ./dev/ssh/.generated:/keys:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "22"]
      interval: 2s
      timeout: 3s
      retries: 30

  bastion2:
    build: ./dev/ssh
    volumes:
      - ./dev/ssh/.generated:/keys:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "22"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  vernier-postgres-data:
  vernier-mysql-data:
  vernier-mariadb-data:
  vernier-mssql-data:
  vernier-mongo-data:
  vernier-clickhouse-data:
